name: Trend radar

on:
  schedule:
    - cron: "17 6 * * *"     # every day at 06:17 UTC; the digest is written on Mondays
  workflow_dispatch:
    inputs:
      digest:
        description: "Write a fresh weekly digest now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trend-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, score and tag
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py ${{ inputs.digest && '--digest' || '' }}

      - name: Commit data
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Radar update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
